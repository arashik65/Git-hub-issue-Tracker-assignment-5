<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />


     <!----tailwind css add-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!---font awesome cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!--Daisy UI CDN-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Style -->
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
</head>
<body>
   <!---Login page html design-->
   <div class="hero bg-base-200 min-h-screen">
      
    <div class="card bg-base-100 w-full max-w-md shrink-0 shadow-2xl p-5">
      <div class="flex flex-col justify-center items-center space-y-1 pt-10">
        <img src="assets/github-logo.png" class="pb-5" alt="">
        <h2 class="text-[#000000] text-2xl font-bold">GitHub Issues Tracker</h2>
        <p class="text-[#64748B] text-base">Sign in to manage your issues</p>
      </div>
      <div class="card-body ">
        <fieldset class="fieldset  space-y-2 ">
          <label class="label text-[#1F2937] text-base font-medium">Username</label>
          <input id="user-input" type="text" maxlength="5" class="input w-full" placeholder="Enter Your Username" />
          <span class="text-primary text-[14px]">Default: admin</span>
          <label class="label  text-[#1F2937] text-base font-medium">Password</label>
          <input id="user-pass" type="password" maxlength="8" class="input w-full" placeholder="Enter Your 8 digit Password" />
          <span class="text-primary text-[14px]">Default: admin123</span>

          <button id="login-btn" class="btn btn-primary mt-4">Sign In</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
</body>
</html>
